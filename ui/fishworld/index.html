<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dsh-fish-world/fishworld/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="鱼的世界新版（别名大肥鱼）· 独立 Flutter 程序">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="鱼的世界新版">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>鱼的世界新版</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
  // DSH 里的新版面板没有旧的 7799 主程序桥。Flutter 侧会先探 10 个端口，
  // 再等快照超时，最后才回落打包快照；这里直接把 health / snapshot 改成同源静态资源。
  (function () {
    try {
      var nativeOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        try {
          var u = String(url || '');
          if (/^https?:\/\/127\.0\.0\.1:779\d\/api\/health/.test(u)) u = 'dsh-health.json';
          else if (/^https?:\/\/127\.0\.0\.1:779\d\/api\/fish\/snapshot/.test(u)) u = 'assets/assets/data/fish_snapshot.json';
          return nativeOpen.call(this, method, u, arguments[2] === undefined ? true : arguments[2], arguments[3], arguments[4]);
        } catch (e) {}
        return nativeOpen.apply(this, arguments);
      };
    } catch (e) {}
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
