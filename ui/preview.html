    emptyGrowth.total = 0

  }

    DATA['/dsh-fish-world/world/growth'].check = { ok: false, problems: ['缺少索引文件，请重建索引'] }
  }

  var real = window.fetch.bind(window)
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || ''
    var path = url.split('?')[0]

    // 批语：预览里记在内存，刷新页面即清空。
    if (path === '/dsh-fish-world/world/diary/comment' && init && init.method === 'POST') {
      try {
        var payload = JSON.parse(init.body || '{}')
        COMMENT_STORE.push({
          diaryId: payload.id,
          actorName: '主人',
          at: new Date().toISOString(),
          text: payload.text,
          quote: payload.quote || '',
          respondedAt: null,
        })
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    // 成长：预览里点「重建索引」也能看到它真的把校验恢复成通过。
    if (path === '/dsh-fish-world/world/growth' && init && init.method === 'POST') {
      try {
        var growthPayload = JSON.parse(init.body || '{}')
        if (growthPayload.action === 'rebuild') {
          DATA[path].check = { ok: true, problems: [] }
        }
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    // 目录选择：预览里给一棵假目录树，点得动但不碰真实磁盘。
    if (path === '/dsh-fish-world/fs/list') {
      var q = new URL(url, 'http://127.0.0.1').searchParams.get('path') || ''
      var FAKE = {
        'C:\\Users\\你': ['Desktop', 'Documents', 'Downloads'],
        'C:\\Users\\你\\Desktop': ['鱼的世界', '截图', '便签'],
        'C:\\Users\\你\\Desktop\\鱼的世界': ['鱼之宝库', '鱼的日记', '鱼与世界'],

        'C:\\Users\\你\\Desktop\\鱼的世界\\鱼与世界': ['QQ', 'B站', '抖音'],
      }
      var parent = q.replace(/\\[^\\]+$/, '') || 'C:\\'
      var body = {
        ok: true,
        path: q || 'C:\\Users\\你',
        parent: q && q !== 'C:\\Users\\你' ? parent : '',
        root: 'C:\\',
        entries: (FAKE[q] || []).map(function (name) { return { name: name, path: (q || 'C:\\Users\\你') + '\\' + name } }),
        truncated: false,
      }
      return Promise.resolve(new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/storage' && init && init.method === 'POST') {
      try {
        var storagePayload = JSON.parse(init.body || '{}')
        var cur = DATA[path]
        if (storagePayload.gallery) {
          cur.folders.gallery = storagePayload.gallery
          DATA['/dsh-fish-world/stickers/dir'].dir = storagePayload.gallery
        }
        if (storagePayload.sites) {
          cur.folders.sites = storagePayload.sites
          DATA['/dsh-fish-world/links'].summary.dir = storagePayload.sites
        }
        if (storagePayload.root != null) cur.root = storagePayload.root || cur.defaultRoot
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/links/collect' && init && init.method === 'POST') {
      try {
        var linkPayload = JSON.parse(init.body || '{}')
        var linkData = DATA['/dsh-fish-world/links']
        var kindId = linkPayload.kind || 'other'
        var codes = { design: 'A', reference: 'B', tool: 'C', article: 'D', inspiration: 'E', other: 'Z' }
        var seq = linkData.items.filter(function (i) { return i.kind === kindId }).length + 1
        linkData.items.unshift({
          id: 'lnk_' + Date.now(),
          no: (codes[kindId] || 'Z') + '-' + String(seq).padStart(2, '0'),
          seq: seq,
          at: new Date().toISOString(),
          url: linkPayload.url,
          host: String(linkPayload.url || '').replace(/^https?:\/\//, '').split('/')[0],
          title: linkPayload.title || String(linkPayload.url || '').replace(/^https?:\/\//, '').split('/')[0],
          note: '',
          tags: [],
          kind: kindId,
          source: '',
        })
        linkData.summary.total = linkData.items.length
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(DATA['/dsh-fish-world/links']), {
        status: 200,
        headers: { 'content-type': 'application/json' },

          recData.items.unshift({
            id: 'mem_' + Date.now(), at: new Date().toISOString(), day: new Date().toISOString().slice(0, 10),

        }
        if (recPayload.action === 'update') {
          var hit = recData.items.find(function (i) { return i.id === recPayload.id })
          if (hit) { hit.text = recPayload.text; hit.revision = Number(hit.revision || 1) + 1 }
        }
        if (recPayload.action === 'remove') {
          recData.items = recData.items.filter(function (i) { return i.id !== recPayload.id })
        }
        if (recPayload.action === 'explain') {
          var g1 = recData.grudges.find(function (g) { return g.id === recPayload.id })
          if (g1) { g1.status = 'explained'; g1.explanation = recPayload.text }
        }
        if (recPayload.action === 'accept') {
          var g2 = recData.grudges.find(function (g) { return g.id === recPayload.id })
          if (g2) g2.status = 'accepted'
        }
        recData.memos = recData.items.length
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200,
        headers: { 'content-type': 'application/json' },

      try {
        var wPayload = JSON.parse(init.body || '{}')
        var list = DATA[path].wishes
        var hit = list.find(function (w) { return w.id === wPayload.id })

          hit.status = wPayload.accept ? 'approved' : 'rejected'
          hit.reply = wPayload.reply || ''
          hit.tone = wPayload.tone || ''
          hit.decidedAt = new Date().toISOString()

      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {

        source: 'role',
        filter: 'saturate(1.15) brightness(1.06)',
        note: '把情绪图放进 moodDir，就会自动替换。',
        available: [],
      })
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    if (Object.prototype.hasOwnProperty.call(DATA, path)) {
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }
    if ((init && init.method === 'POST') || path.indexOf('/dsh-') === 0) {
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }
    return real(input, init)
  }
