        var linkData = DATA['/dsh-fish-world/links']
        var kindId = linkPayload.kind || 'other'
        var codes = { design: 'A', reference: 'B', tool: 'C', article: 'D', inspiration: 'E', other: 'Z' }
        var seq = linkData.items.filter(function (i) { return i.kind === kindId }).length + 1
        linkData.items.unshift({
          id: 'lnk_' + Date.now(),
          no: (codes[kindId] || 'Z') + '-' + String(seq).padStart(2, '0'),
          seq: seq,
          at: new Date().toISOString(),
          url: linkPayload.url,
          host: String(linkPayload.url || '').replace(/^https?:\/\//, '').split('/')[0],
          title: linkPayload.title || String(linkPayload.url || '').replace(/^https?:\/\//, '').split('/')[0],
          note: '',
          tags: [],
          kind: kindId,
          source: '',
        })
        linkData.summary.total = linkData.items.length
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(DATA['/dsh-fish-world/links']), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/world/records' && init && init.method === 'POST') {
      try {
        var recPayload = JSON.parse(init.body || '{}')
        var recData = DATA[path]
        if (recPayload.action === 'add') {
          recData.items.unshift({
            id: 'mem_' + Date.now(), at: new Date().toISOString(), day: new Date().toISOString().slice(0, 10),
            text: recPayload.text, source: 'owner', revision: 1, status: 'active',
          })
        }
        if (recPayload.action === 'update') {
          var hit = recData.items.find(function (i) { return i.id === recPayload.id })
          if (hit) { hit.text = recPayload.text; hit.revision = Number(hit.revision || 1) + 1 }
        }
        if (recPayload.action === 'remove') {
          recData.items = recData.items.filter(function (i) { return i.id !== recPayload.id })
        }
        if (recPayload.action === 'explain') {
          var g1 = recData.grudges.find(function (g) { return g.id === recPayload.id })
          if (g1) { g1.status = 'explained'; g1.explanation = recPayload.text }
        }
        if (recPayload.action === 'accept') {
          var g2 = recData.grudges.find(function (g) { return g.id === recPayload.id })
          if (g2) g2.status = 'accepted'
        }
        recData.memos = recData.items.length
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/world/diary') {
      var base = DATA[path]
      var body = Object.assign({}, base, {
        comments: (base.comments || []).concat(COMMENT_STORE),
      })
      return Promise.resolve(new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/fish/profile' && init && init.method === 'POST') {
      var patch = {}
      try { patch = JSON.parse(init.body || '{}') } catch (e) {}
      var profileData = DATA[path]
      // 主人绑定走另一条路（真源是 QQ 桥）：预览里同样真的改，好验「保存后三处一致」。
      if (patch.ownerQQ != null || patch.ownerSession != null) {
        var owner = profileData.owner || {}
        owner.qq = owner.qq || {}
        owner.session = owner.session || {}
        if (patch.ownerQQ != null) {
          owner.qq = { bridge: patch.ownerQQ, config: patch.ownerQQ, relation: patch.ownerQQ }
        }
        if (patch.ownerSession != null) {
          owner.session = { bridge: patch.ownerSession, config: patch.ownerSession, relation: patch.ownerSession }
          owner.sessionAlive = (profileData.sessions || []).some(function (s) { return s.id === patch.ownerSession })
        }
        owner.qqAgree = true
        owner.sessionAgree = true
        profileData.owner = owner
        profileData.sessions = (profileData.sessions || []).map(function (s) {
          return Object.assign({}, s, { inWorkspace: s.id === patch.ownerSession })
        })
        return Promise.resolve(new Response(JSON.stringify({
          ok: true, fish: profileData.fish, current: profileData.current, roles: profileData.roles,
          owner: owner, sessions: profileData.sessions,
        }), { status: 200, headers: { 'content-type': 'application/json' } }))
      }
      var next = Object.assign({}, profileData.fish, patch)
      profileData.fish = next
      profileData.current = Object.assign({}, profileData.current, { displayName: next.name || '鱼' })
      return Promise.resolve(new Response(JSON.stringify({
        ok: true,
        fish: next,
        current: profileData.current,
        roles: profileData.roles,
      }), { status: 200, headers: { 'content-type': 'application/json' } }))
    }

    // 请求历史按日期读：?date=YYYY-MM-DD 只返回那天的（与真实路由一致）。
    if (path === '/dsh-fish-world/world/wishes' && (!init || init.method !== 'POST')) {
      var wishData = DATA[path]
      var wantDay = (url.split('date=')[1] || '').slice(0, 10)
      if (!wantDay) {
        return Promise.resolve(new Response(JSON.stringify(wishData), { status: 200, headers: { 'content-type': 'application/json' } }))
      }
      var only = (wishData.wishes || []).filter(function (w) { return String(w.at).slice(0, 10) === wantDay })
      return Promise.resolve(new Response(JSON.stringify(Object.assign({}, wishData, { date: wantDay, wishes: only })), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/world/wishes' && init && init.method === 'POST') {
      try {
        var wPayload = JSON.parse(init.body || '{}')
        var list = DATA[path].wishes
        var hit = list.find(function (w) { return w.id === wPayload.id })
        if (hit) {
          hit.status = wPayload.accept ? 'approved' : 'rejected'
          hit.reply = wPayload.reply || ''
          hit.tone = wPayload.tone || ''
          hit.decidedAt = new Date().toISOString()
        }
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/doctor/update' && init) {
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/fish/portrait/upload' && init) {
      try {
        var uploadBody = JSON.parse(init.body || '{}')
        DATA['/dsh-fish-world/fish/portrait'] = Object.assign({}, DATA['/dsh-fish-world/fish/portrait'], {
          source: 'custom',
          imageUrl: uploadBody.dataUrl || DATA['/dsh-fish-world/fish/portrait'].imageUrl,
          filter: 'none',
          note: '正在使用你放进去的情绪图。',
          available: [uploadBody.emotion],
        })
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    if (path === '/dsh-fish-world/fish/portrait/remove' && init) {
      DATA['/dsh-fish-world/fish/portrait'] = Object.assign({}, DATA['/dsh-fish-world/fish/portrait'], {
        source: 'role',
        filter: 'saturate(1.15) brightness(1.06)',
        note: '把情绪图放进 moodDir，就会自动替换。',
        available: [],
      })
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    // 平台设置：保存必须真的写回假数据。
    // 之前这里落到下面的「有 key 就直接回原样」分支，改完立刻弹回旧值，
    // 看起来就像所有数字框都调不动。
    if (path === '/dsh-fish-world/platforms' && init && init.method === 'POST') {
      var platformsData = DATA[path]
      try {
        var platPayload = JSON.parse(init.body || '{}')
        if (platPayload.action === 'bridge-switch') {
          var qqSide = (platformsData.platforms || []).find(function (item) { return item.id === 'qq' })
          if (qqSide && qqSide.account) {
            if (platPayload.name === '总开关') qqSide.account.masterSwitch = platPayload.value === true
            if (platPayload.name === '试运行') qqSide.account.trial = platPayload.value === true
          }
        } else {
          var hit = (platformsData.platforms || []).find(function (item) { return item.id === platPayload.id })
          if (hit) hit.config = Object.assign({}, hit.config, platPayload.config || {})
        }
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify({ ok: true, platforms: platformsData.platforms }), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    // 配置：空间额度那一排输入框写的是 config.qzone，同样要落回假数据，
    // 否则「动态/空间 每日上限」改完也一样弹回去。
    if (path === '/dsh-fish-world/config' && init && init.method === 'POST') {
      var configData = DATA['/dsh-fish-world/config']
      try {
        var cfgPayload = JSON.parse(init.body || '{}')
        if (cfgPayload.qzone) configData.config.qzone = Object.assign({}, configData.config.qzone, cfgPayload.qzone)
      } catch (e) {}
      return Promise.resolve(new Response(JSON.stringify(configData), {
        status: 200, headers: { 'content-type': 'application/json' },
      }))
    }

    if (Object.prototype.hasOwnProperty.call(DATA, path)) {
      return Promise.resolve(new Response(JSON.stringify(DATA[path]), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }
    if ((init && init.method === 'POST') || path.indexOf('/dsh-') === 0) {
      return Promise.resolve(new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }
    return real(input, init)
  }
})()
</script>
